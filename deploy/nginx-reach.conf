server {
    listen 80;
    server_name reach.lingchen-ai.com www.reach.lingchen-ai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://reach.lingchen-ai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.reach.lingchen-ai.com;

    ssl_certificate /etc/letsencrypt/live/reach.lingchen-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reach.lingchen-ai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://reach.lingchen-ai.com$request_uri;
}

server {
    listen 443 ssl;
    server_name reach.lingchen-ai.com;

    ssl_certificate /etc/letsencrypt/live/reach.lingchen-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reach.lingchen-ai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AI_REACH_SSL:10m;
    ssl_session_timeout 10m;

    root /home/lingchen/web/ai-reach/current;
    index index.html;

    location ~ ^(/[^/]*)?/actuator.*(/.*)?$ {
        return 403;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(bak|sql|log|conf|ini|key|pem|svn-base)$ {
        deny all;
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /dev-api {
        return 308 /dev-api/;
    }

    location ^~ /dev-api/resource/sse {
        proxy_pass http://110.42.223.109:19090/resource/sse;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /dev-api/ {
        proxy_pass http://110.42.223.109:19090/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxy_connection;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /ai-call-agent-api {
        return 308 /ai-call-agent-api/;
    }

    location ^~ /ai-call-agent-api/ {
        proxy_pass http://10.77.0.2:19011/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxy_connection;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    location ^~ /ai-call-oss/ {
        proxy_pass http://10.77.0.1:9000/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /livekit/ {
        proxy_pass http://10.77.0.2:7880/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxy_connection;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
